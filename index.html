<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage Renderer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .info {
        position: fixed;
        bottom: 0;
        right: 0;
        background: white;
        padding: 2px 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="info">
      © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors
    </div>
    <script type="module">
      import * as THREE from 'three'
      import { MapControls } from 'three/addons/controls/MapControls.js'
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
      import { VantageProjection, setupLights, loadTexture } from '/src/main.js'

      const canvas = document.getElementById('canvas')

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setPixelRatio(window.devicePixelRatio)
      renderer.setSize(window.innerWidth, window.innerHeight)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0xf0f0f0)
      scene.add(setupLights())

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
      )
      camera.position.set(-100, 50, 50)
      camera.lookAt(0, 0, 0)

      const controls = new MapControls(camera, canvas)
      controls.enableDamping = true

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // Load models and textures
      const loader = new GLTFLoader()

      const [textured, scene2, texture1, texture2] = await Promise.all([
        loader.loadAsync('./media/textured.glb'),
        loader.loadAsync('./media/scene.gltf'),
        loadTexture('./media/IMG_3271.jpeg'),
        loadTexture('./media/hermann-1.jpg')
      ])

      const modelGroup = new THREE.Group()
      modelGroup.position.set(0, -10, -10)
      modelGroup.rotation.set(0, THREE.MathUtils.degToRad(30), 0)

      textured.scene.scale.setScalar(100)
      modelGroup.add(textured.scene, scene2.scene)
      scene.add(modelGroup)

      // Create projections
      const projection1 = new VantageProjection({ texture: texture1, fov: 60, near: 1, far: 200 })
      projection1.position.set(100, 100, 0)
      projection1.rotation.set(0, THREE.MathUtils.degToRad(45), 0)
      scene.add(projection1)
      projection1.project(modelGroup)

      const projection2 = new VantageProjection({ texture: texture2, fov: 60, near: 10, far: 200 })
      projection2.position.set(-180, 4, -140)
      projection2.rotation.set(0, THREE.MathUtils.degToRad(-90), 0)
      scene.add(projection2)
      projection2.project(modelGroup)

      // Enable camera helpers on layer 2
      camera.layers.enable(2)

      // Render loop
      renderer.setAnimationLoop(() => {
        controls.update()
        projection1.update(renderer, scene)
        projection2.update(renderer, scene)
        renderer.render(scene, camera)
      })
    </script>
  </body>
</html>
